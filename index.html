<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rizam T P | Aviation Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
scroll-behavior:smooth;
}

body{
background:#f5f7fa;
color:#333;
overflow-x:hidden;
}

.hero{
height:100vh;
background:
linear-gradient(rgba(0,30,60,.65),rgba(0,30,60,.65)),
url('https://images.unsplash.com/photo-1436491865332-7a61a109cc05?auto=format&fit=crop&w=1600&q=80');
background-size:cover;
background-position:center;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
color:white;
padding:20px;
}

.hero-content{
animation:fadeIn 2s;
}

.hero h1{
font-size:4rem;
font-weight:700;
letter-spacing:2px;
}

.hero h2{
font-size:1.3rem;
margin-top:15px;
font-weight:400;
}

.btn{
display:inline-block;
margin:10px;
padding:14px 30px;
background:white;
color:#003366;
text-decoration:none;
border-radius:40px;
font-weight:600;
transition:.3s;
}

.btn:hover{
transform:translateY(-5px);
}

section{
padding:80px 10%;
}

.title{
text-align:center;
font-size:2rem;
color:#003366;
margin-bottom:40px;
}

.about{
display:grid;
grid-template-columns:1fr 2fr;
gap:40px;
align-items:center;
}

.profile{
width:260px;
height:260px;
border-radius:50%;
background:#003366;
margin:auto;
display:flex;
justify-content:center;
align-items:center;
color:white;
font-size:4rem;
}

.card-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
}

.card{
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,.08);
transition:.3s;
}

.card:hover{
transform:translateY(-10px);
}

.timeline{
max-width:800px;
margin:auto;
}

.timeline-item{
background:white;
padding:20px;
margin-bottom:20px;
border-left:5px solid #0077ff;
box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.skill{
margin-bottom:20px;
}

.skill p{
font-weight:600;
margin-bottom:8px;
}

.bar{
height:12px;
background:#ddd;
border-radius:20px;
overflow:hidden;
}

.fill{
height:100%;
background:#0077ff;
animation:grow 3s forwards;
}

.contact{
text-align:center;
}

.contact a{
display:inline-block;
margin:10px;
text-decoration:none;
font-weight:600;
color:#003366;
}

footer{
background:#002244;
color:white;
text-align:center;
padding:20px;
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(50px);
}
to{
opacity:1;
transform:translateY(0);
}
}

@keyframes grow{
from{width:0;}
}

</style>
</head>

<body>

<section class="hero">

<div class="hero-content">

<h1>RIZAM T P</h1>

<h2>
AVIATION GROUND OPERATIONS<br>
AIRLINE LOGISTICS<br
